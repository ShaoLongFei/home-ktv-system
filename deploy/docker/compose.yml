services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-home_ktv}
      POSTGRES_USER: ${POSTGRES_USER:-ktv}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ktv}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ktv} -d ${POSTGRES_DB:-home_ktv}"]
      interval: 5s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DOCKER_DATABASE_URL:-postgres://ktv:ktv@postgres:5432/home_ktv}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:4000}
      CONTROLLER_BASE_URL: ${CONTROLLER_BASE_URL:-http://127.0.0.1:5176}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://127.0.0.1:5174,http://127.0.0.1:5176}
      MEDIA_ROOT: ${DOCKER_MEDIA_ROOT:-/data/home-ktv-media}
      MEDIA_PATH_MAPPINGS: ${DOCKER_MEDIA_PATH_MAPPINGS:-/mnt/nas/KTV歌曲=/nas/KTV歌曲}
      LLM_API_BASE_URL: ${LLM_API_BASE_URL:-}
      LLM_API_KEY: ${LLM_API_KEY:-}
      LLM_MODEL: ${LLM_MODEL:-}
      TV_ROOM_SLUG: ${TV_ROOM_SLUG:-living-room}
      ONLINE_PROVIDER_IDS: ${ONLINE_PROVIDER_IDS:-}
      ONLINE_PROVIDER_KILL_SWITCH_IDS: ${ONLINE_PROVIDER_KILL_SWITCH_IDS:-}
      IGEBA_ENABLED: ${IGEBA_ENABLED:-false}
      IGEBA_BASE_URL: ${IGEBA_BASE_URL:-http://app.ige8.net}
      IGEBA_UID: ${IGEBA_UID:-0}
      IGEBA_MIN_INTERVAL_MS: ${IGEBA_MIN_INTERVAL_MS:-1000}
      IGEBA_CACHE_DIR: ${IGEBA_CACHE_DIR:-}
      IGEBA_CONCURRENCY: ${IGEBA_CONCURRENCY:-1}
      IGEBA_CACHE_MAX_BYTES: ${IGEBA_CACHE_MAX_BYTES:-53687091200}
      IGEBA_CACHE_MAX_ITEMS: ${IGEBA_CACHE_MAX_ITEMS:-200}
      IGEBA_CACHE_TTL_DAYS: ${IGEBA_CACHE_TTL_DAYS:-30}
      HOST: 0.0.0.0
      PORT: 4000
    ports:
      - "${API_PORT:-4000}:4000"
    volumes:
      - ${KTV_MEDIA_HOST_PATH:-../../runtime/media}:${DOCKER_MEDIA_ROOT:-/data/home-ktv-media}
      - ${KTV_NAS_HOST_PATH:-../../runtime/nas/KTV歌曲}:/nas/KTV歌曲:ro

  admin:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        APP_FILTER: "@home-ktv/admin"
        APP_DIR: "apps/admin"
        VITE_API_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${ADMIN_PORT:-5174}:80"

  controller:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        APP_FILTER: "@home-ktv/controller"
        APP_DIR: "apps/controller"
        VITE_API_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${CONTROLLER_PORT:-5176}:80"

  tv-web:
    build:
      context: ../..
      dockerfile: deploy/docker/Dockerfile.web
      args:
        APP_FILTER: "@home-ktv/tv-web"
        APP_DIR: "apps/tv-web"
        VITE_API_BASE_URL: ${PUBLIC_BASE_URL:-http://127.0.0.1:4000}
    restart: unless-stopped
    depends_on:
      - api
    ports:
      - "${TV_WEB_PORT:-5173}:80"

volumes:
  postgres-data:
